name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Check dependency metadata
        run: npm run audit:offline

      - name: Check package contents
        run: npm run pack:check

      - name: Install dashboard dependencies
        working-directory: web
        run: npm ci

      - name: Lint dashboard
        working-directory: web
        run: npm run lint

      - name: Build dashboard
        working-directory: web
        run: npm run build
